[project]
name = "ai-question-analyzer"
version = "0.1.0"
description = "A Python-based AI question analyzer"
readme = "README.md"
authors = [
    { name = "Rohith", email = "leo433554@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "groq>=1.0.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "streamlit>=1.50.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
